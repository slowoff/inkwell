# Runs all Inkwell tests (tests/run.sh) in headless Chromium on every push, against fake Supabase/Google servers.
# A red cross on a commit in GitHub means something broke; the log says which check failed.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.48.0 pillow
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: tests/run.sh
