# Runs all Inkwell tests (tests/run.sh) in headless Chromium on every push, against fake Supabase/Google servers.
# A red cross on a commit in GitHub means something broke; the log (and the annotations) say which check failed.
# Playwright is pinned to the version the tests are written with: 1.48 made some tests hang on GitHub now and then.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.56.0 pillow python-docx reportlab
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ESLint (checks the code for mistakes; the app itself has no build step)
        run: npm install --no-save --no-package-lock eslint@9.13.0 globals@15.11.0 acorn@8.14.0 acorn-walk@8.3.4
      - name: Run tests
        run: tests/run.sh
