# Runs all Inkwell tests (tests/run.sh) in headless Chromium on every push, against fake Supabase/Google servers.
# A red cross on a commit in GitHub means something broke; the log says which check failed.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: tests/run.sh 2>&1 | tee /tmp/test-log.txt; exit ${PIPESTATUS[0]}
      - name: Save log (debug)
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-logs-${{ github.run_id }}; git rm -rqf . ; cp /tmp/test-log.txt log.txt; ls -R tests/out 2>/dev/null | head -50 > outs.txt || true
          git add log.txt outs.txt; git commit -qm log; git push -f origin ci-logs-${{ github.run_id }}
