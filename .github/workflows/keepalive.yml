# Keeps the free Supabase project from pausing (it pauses after 7 days without use, e.g. in school holidays).
# Every 3 days it asks the database for nothing (the public publishable key, since 1.35; row-level security returns an empty list).
# GitHub switches off scheduled workflows after 60 days without commits, so it also switches itself back on.
name: Keep sync awake
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database
        env:
          KEY: sb_publishable_Wf2ZJlMsIHfVzaPZCu44fQ_5Ue4d8G5
        run: |
          curl -fsS --retry 3 --retry-delay 20 "https://pubaedzrgrkjifmiqiew.supabase.co/rest/v1/docs?select=id&limit=1" -H "apikey: $KEY" -o /dev/null -w "HTTP %{http_code}\n"
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
